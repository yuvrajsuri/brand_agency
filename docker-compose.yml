version: '3.8'

services:
  overlay-engine:
    build: .
    container_name: text-overlay-engine
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./:/app
      - overlay-cache:/tmp/overlay-engine
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  overlay-cache:
    driver: local
