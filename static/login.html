<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrandBot - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.3);
        }

        h1 {
            font-size: 2rem;
            color: #128C7E;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 30px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #25D366;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .demo-btn {
            margin-top: 15px;
            background: white;
            color: #25D366;
            border: 2px solid #25D366;
            box-shadow: none;
        }

        .demo-btn:hover {
            background: #f0fff4;
        }

        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            color: #666;
            font-size: 0.9rem;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: #f0fff4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .error {
            color: #f44336;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🤖</div>
        <h1>BrandBot</h1>
        <p class="subtitle">AI-Powered Marketing Assistant</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="userName">What's your name?</label>
                <input 
                    type="text" 
                    id="userName" 
                    placeholder="Enter your name" 
                    required
                    minlength="2"
                    autocomplete="name"
                >
                <div class="error" id="errorMessage"></div>
            </div>

            <button type="submit" class="btn">
                🚀 Start Creating
            </button>

            <button type="button" class="btn demo-btn" onclick="startDemo()">
                ⚡ Try Quick Demo
            </button>
        </form>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎨</div>
                <div>Generate stunning posters in Punjabi, Hindi & English</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div>AI-powered copy generation with Google Gemini</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div>Create multiple variations instantly</div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const userName = document.getElementById('userName').value.trim();
            const errorMessage = document.getElementById('errorMessage');

            if (userName.length < 2) {
                errorMessage.textContent = '⚠️ Name must be at least 2 characters';
                errorMessage.classList.add('show');
                return;
            }

            // Store user data in sessionStorage
            const userData = {
                name: userName,
                loginTime: new Date().toISOString(),
                isDemo: false
            };

            sessionStorage.setItem('userData', JSON.stringify(userData));
            sessionStorage.setItem('conversationHistory', JSON.stringify([]));
            
            // Redirect to chat
            window.location.href = '/chat.html';
        }

        function startDemo() {
            // Store demo user data
            const userData = {
                name: 'Demo User',
                loginTime: new Date().toISOString(),
                isDemo: true,
                businessName: 'Singh Sweets',
                businessType: 'restaurant',
                language: 'punjabi',
                template: 'festival'
            };

            sessionStorage.setItem('userData', JSON.stringify(userData));
            sessionStorage.setItem('conversationHistory', JSON.stringify([]));
            
            // Redirect to chat
            window.location.href = '/chat.html?demo=true';
        }

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const userData = sessionStorage.getItem('userData');
            if (userData) {
                // User already has session, redirect to chat
                window.location.href = '/chat.html';
            }
        });
    </script>
</body>
</html>
